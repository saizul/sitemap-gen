name: Feature request
description: Suggest a crawler option, a sitemap extension or a CLI improvement
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: CLI flags or output you have in mind.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
