[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "sitemap-gen"
dynamic = ["version"]
description = "Crawl a website politely (robots.txt, concurrency limit, same host, canonical and noindex aware) and generate sitemap.xml with automatic sitemap index splitting, lastmod, gzip and image sitemaps."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Saizul Amin" }]
keywords = ["sitemap", "sitemap-xml", "sitemap-generator", "seo", "crawler", "web-crawler", "robots-txt", "image-sitemap", "httpx", "asyncio"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
    "Topic :: Internet :: WWW/HTTP :: Site Management",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.27,<1",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "ruff>=0.4"]

[project.urls]
Homepage = "https://github.com/saizul/sitemap-gen"
Issues = "https://github.com/saizul/sitemap-gen/issues"
Changelog = "https://github.com/saizul/sitemap-gen/blob/main/CHANGELOG.md"

[project.scripts]
sitemap-gen = "sitemap_gen.cli:main"

[tool.setuptools.dynamic]
version = { attr = "sitemap_gen._version.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sitemap_gen = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "C4", "SIM", "RUF"]
ignore = ["SIM108", "RUF022", "RUF001"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
