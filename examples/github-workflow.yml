# Regenerate sitemap.xml every night and commit it if it changed.
# Copy to .github/workflows/sitemap.yml in your site's repository.
name: Sitemap

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sitemap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Crawl the live site
        run: |
          docker run --rm ghcr.io/saizul/sitemap-gen:latest https://example.com \
            -o - --lastmod --images --delay 0.5 > public/sitemap.xml
      - name: Commit if changed
        run: |
          git config user.name "sitemap bot"
          git config user.email "sitemap-bot@users.noreply.github.com"
          git add public/sitemap.xml
          git diff --cached --quiet || git commit -m "Update sitemap.xml"
          git push
